<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyForge | Finalize Order</title>
    <link rel="stylesheet" href="checkout.css">
    <link rel="icon" type="image/x-icon" href="tau.png">
    <style>
        /* --- SYNCED HEADER STYLES --- */
        header { 
            background: #080808; 
            border-bottom: 2px solid #00f0ff; 
            height: 70px; 
            z-index: 100; 
        }

        .nav-content-main { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            height: 100%; 
            padding: 0 25px; 
        }

        .header-right-actions { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        /* User Profile Pill */
        .user-profile-container { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: rgba(255,255,255,0.05); 
            padding: 5px 12px; 
            border-radius: 20px; 
            border: 1px solid #333; 
        }

        .user-avatar { 
            width: 28px; height: 28px; 
            background: #00f0ff; color: #000; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 0.75rem; 
        }

        .username { 
            font-size: 0.85rem; color: #fff; 
            max-width: 100px; overflow: hidden; text-overflow: ellipsis; 
            white-space: nowrap;
        }

        /* Consistent Red Logout Button */
        .logout-header-btn { 
            background: #ff4d4d; color: white; border: none; 
            padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; 
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }

        .logout-header-btn:hover { background: #e64545; }
    </style>
</head>
<body>
    <div id="wrapper">
        <header>
            <div class="nav-content-main">
                <div class="nav-group-left">
                    <h1 class="logo">SkyForge<span style="color:#00f0ff">3D</span></h1>
                </div>

                <nav class="main-nav">
                    <button class="nav-link" onclick="window.location.href='marketplace.html'">Marketplace</button>
                    <button class="nav-link" onclick="window.location.href='configurator.html'">Configurator</button>
                    <button class="nav-link active" id="nav-checkout" onclick="window.location.href='checkout.html'">Checkout</button>
                    <button class="nav-link" onclick="window.location.href='support.html'">Support</button>
                </nav>

                <div class="header-right-actions">
                    <div class="user-profile-container">
                        <div class="user-avatar" id="user-initial">U</div>
                        <span class="username" id="display-username">User</span>
                        <button class="logout-header-btn" onclick="logout()">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="checkout-container">
            <div class="checkout-box">
                <h2 class="category-title" style="margin-top:0;">Shipping Details</h2>
                <form id="checkout-form">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="cust-name" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group">
                            <label>Contact Number</label>
                            <input type="tel" id="cust-phone" placeholder="09XXXXXXXXX" required pattern="[0-9]{11}">
                        </div>
                        <div class="input-group">
                            <label>City / Province</label>
                            <input type="text" id="cust-city" placeholder="e.g. Metro Manila" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Complete Shipping Address</label>
                        <input type="text" id="cust-address" placeholder="House No., Street, Brgy" required>
                    </div>

                    <h2 class="category-title" style="margin-top:40px;">Payment Method</h2>
                    <div class="payment-methods">
                        <div class="pay-option active" onclick="selectPayment(this)">
                            <strong>COD</strong>
                            <small>Cash on Delivery</small>
                        </div>
                        <div class="pay-option" onclick="selectPayment(this)">
                            <strong>E-WALLET</strong>
                            <small>GCash / Maya</small>
                        </div>
                        <div class="pay-option" onclick="selectPayment(this)">
                            <strong>CARD</strong>
                            <small>Credit / Debit</small>
                        </div>
                    </div>
                </form>
            </div>

            <aside class="checkout-box summary-sidebar">
                <h3 class="summary-header">Order Summary</h3>
                <div id="final-items-list"></div>
                
                <div class="total-section">
                    <div class="total-row">
                        <span class="total-label">Grand Total</span>
                        <div class="total-display" id="final-total">₱0</div>
                    </div>
                </div>
                
                <button type="button" class="buy-btn" onclick="placeOrder()">
                    Confirm & Place Order
                </button>
                <p class="security-note">Secure Encrypted Transaction</p>
            </aside>
        </main>
    </div>

    <script>
        window.onload = function() {
            // Updated to use the shared IDs: display-username and user-initial
            const savedName = localStorage.getItem('savedUsername');
            const nameDisplay = document.getElementById('display-username');
            const initialDisplay = document.getElementById('user-initial');
            const nameInput = document.getElementById('cust-name');

            if (savedName) {
                nameDisplay.innerText = savedName;
                nameInput.value = savedName;
                initialDisplay.innerText = savedName.charAt(0).toUpperCase();
            }

            // Load Cart Data
            const cartData = JSON.parse(localStorage.getItem('finalCart')) || [];
            const listDiv = document.getElementById('final-items-list');
            const totalDiv = document.getElementById('final-total');
            let total = 0;

            if (cartData.length === 0) {
                listDiv.innerHTML = "<p style='color:#444; text-align:center;'>Your cart is empty.</p>";
            } else {
                cartData.forEach(item => {
                    total += item.price;
                    listDiv.innerHTML += `
                        <div class="summary-item">
                            <span>${item.name}</span>
                            <span class="item-price">₱${item.price.toLocaleString()}</span>
                        </div>
                    `;
                });
            }
            totalDiv.innerText = `₱${total.toLocaleString()}`;
        };

        function selectPayment(element) {
            document.querySelectorAll('.pay-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
        }

        function placeOrder() {
            const form = document.getElementById('checkout-form');
            if(!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            alert("Order Successful! SkyForge3D is now preparing your order.");
            localStorage.removeItem('finalCart');
            window.location.href = 'marketplace.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
